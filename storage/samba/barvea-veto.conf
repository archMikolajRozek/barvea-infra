# BARVEA — globalna lista veto (bezpieczeństwo), włączana z [global] smb.conf:
#   include = /etc/samba/barvea-veto.conf
# Źródło prawdy listy = BLOCKED_EXTENSIONS w app lib/upload-security.ts —
# TRZYMAĆ W SYNCHRONIE (audyt 2026-09-24). Makra Office (.docm/.xlsm) celowo
# NIE są tu — kosztorysy z makrami to codzienność AEC.
# Dlaczego na Sambie, nie tylko w appce: AutoCAD auto-wykonuje acad.lsp /
# acaddoc.lsp / *.mnl z katalogu otwieranego rysunku; katalog Drive = realny
# folder na udziale, więc jeden plik od jednego użytkownika = wektor na cały
# zespół. Appka od 09.2026 nie robi dokumentu CDE z takiego pliku, ale bez
# veto plik i tak fizycznie leży na udziale i jest widoczny w Explorerze.
# Reload: `smbcontrol all reload-config` wystarcza (veto ≠ vfs, bez restartu).
# Efekt uboczny: ISTNIEJĄCE pliki pasujące do listy znikają z widoku SMB
# (nie są kasowane; w web nadal widoczne). `delete veto files = yes` = przy
# kasowaniu katalogu vetowane pliki w nim też lecą.
# Per-org veto z acl-sync (shareConfig.vetoFiles) NADPISUJE ten parametr na
# poziomie share'a — dlatego barvea-acl-sync.py dokleja tę listę do swojej.
   veto files = /*.exe/*.dll/*.bat/*.cmd/*.com/*.msi/*.scr/*.pif/*.cpl/*.vbs/*.vbe/*.js/*.jse/*.wsf/*.wsh/*.ps1/*.psm1/*.hta/*.lnk/*.reg/*.inf/*.jar/*.sh/*.lsp/*.fas/*.vlx/*.mnl/*.dvb/*.arx/*.dbx/*.crx/*.html/*.htm/*.svg/*.php/
   delete veto files = yes
