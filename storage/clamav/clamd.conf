# BARVEA — clamd na LXC 201 (barvea-storage). Pushowany przez bootstrap /
# runbook do /etc/clamav/clamd.conf (zastępuje debconfowy plik Debiana).
#
# DLACZEGO TU, a nie kontener na VM 102 (jak proponował APP): skan `zSCAN
# <ścieżka>` dla ingestu z Drive wymaga, żeby clamd WIDZIAŁ ZFS orgów, a
# /srv/orgs istnieje tylko w LXC 201 (bind z hddpool/orgs na hoście). VM 102
# nie ma do tego dostępu. Jeden daemon tutaj obsługuje oba tryby: INSTREAM
# (appka streamuje upload web/plugin po LAN) i SCAN (pliki z udziału).
#
# ROOT, nie user clamav: pliki WIP mają 0600 i właściciela smb-usera
# (uid 5100+); `clamav` nie mógłby ich czytać → SCAN "Access denied".
# LXC jest nieuprzywilejowany (root w LXC = 100000 na hoście), więc root
# wewnątrz jest akceptowalny. Brak `User` = zostaje root (unit Debiana
# startuje clamd jako root, zrzut uprawnień robi dopiero opcja User).
# Sprawdź po starcie: ps -o user= -C clamd  → root

LogSyslog yes
LogFacility LOG_LOCAL6
LogTime yes
PidFile /run/clamav/clamd.pid
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 666
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav

# TCP TYLKO na adresie LAN LXC-a. Do 10.10.0.40 z sieci wg-users dochodzi
# wyłącznie 445 (BARVEA_USER_IN), więc 3310 widzi tylko LAN 10.10.0.0/24.
# UWAGA (2026-09-24): przy aktywacji socketu przez systemd (default Debian)
# clamd IGNORUJE te dwie linie — realny nasłuch TCP definiuje override
# clamav-daemon.socket-tcp.conf (ListenStream). Zostawione dla uruchomień
# bez systemd (kontener/dedyk) i jako dokumentacja intencji.
TCPSocket 3310
TCPAddr 10.10.0.40

# Sufity ≥ AV_MAX_BYTES appki (domyślnie 2 GB) — inaczej duże pliki
# kończą się "INSTREAM size limit exceeded" zamiast werdyktem.
StreamMaxLength 2100M
MaxFileSize 2100M
MaxScanSize 2100M
MaxRecursion 16
MaxFiles 10000

# Sygnatury ~1.5 GB w RAM. Bez ConcurrentDatabaseReload przeładowanie nie
# dubluje pamięci (LXC 201 ma 12 G razem z Sambą i datad).
ConcurrentDatabaseReload no
MaxThreads 8
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 60
SelfCheck 3600

# Skanowanie: archiwa/dokumenty/PDF/OLE2 tak, bomby dekompresyjne — alarm
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanHTML yes
ScanXMLDOCS yes
ScanArchive yes
AlertBrokenExecutables yes
AlertEncrypted no
AlertExceedsMax no
Bytecode yes
BytecodeSecurity TrustSigned
HeuristicAlerts yes
PhishingSignatures yes
PhishingScanURLs yes
DetectPUA no
