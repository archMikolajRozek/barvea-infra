[Unit]
# 2026-11-24: po restarcie LXC 201 (20.11) socket TCP nie wstal — bind na 10.10.0.40 zanim
# interfejs dostal adres → socket "failed", clamd nigdy nie wystartowal, 4 dni uploadow bez skanu.
After=network-online.target
Wants=network-online.target

[Socket]
# Debian startuje clamd przez aktywacje socketu; wtedy clamd IGNORUJE
# TCPSocket/TCPAddr z clamd.conf i bierze gniazda tylko od systemd.
# Bez tego override nasluch jest wylacznie na /run/clamav/clamd.ctl.
# Instalacja: /etc/systemd/system/clamav-daemon.socket.d/tcp.conf
ListenStream=10.10.0.40:3310
# IP_FREEBIND: bind na adres, ktorego jeszcze nie ma na interfejsie (start przed siecia)
FreeBind=true
