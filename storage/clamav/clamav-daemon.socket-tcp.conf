[Socket]
# Debian startuje clamd przez aktywacje socketu; wtedy clamd IGNORUJE
# TCPSocket/TCPAddr z clamd.conf i bierze gniazda tylko od systemd.
# Bez tego override nasluch jest wylacznie na /run/clamav/clamd.ctl.
# Instalacja: /etc/systemd/system/clamav-daemon.socket.d/tcp.conf
ListenStream=10.10.0.40:3310
