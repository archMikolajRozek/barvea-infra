#!/usr/sbin/nft -f
# ═══════════════════════════════════════════════════════════════════
# BARVEA — barvea-host /etc/nftables.conf (IaC copy 1:1 z żywego,
# zrzut 2026-07-13). Instalacja: cp → /etc/nftables.conf;
# systemctl enable --now nftables. ⚠️ KEEP-IN-SYNC z żywym plikiem.
# Uwaga: na hoście działa też legacy iptables z (a) f2b-sshd
# (fail2ban, dynamiczne — nie odtwarzać ręcznie) oraz (b) zdublowanym
# MASQUERADE 10.10.0.0/24 (artefakt sprzed migracji na nft; nft jest
# autorytatywny, duplikat nieszkodliwy — przy świeżej instalacji NIE
# odtwarzać).
# ═══════════════════════════════════════════════════════════════════

flush ruleset

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;

        # Forward WireGuard UDP 51820 z publicznego IP hosta na VM barvea-infra
        iif vmbr0 udp dport 51820 dnat to 10.10.0.10:51820
        iif vmbr0 udp dport 51821 dnat to 10.10.0.10:51821
        iif "vmbr0" tcp dport 80 dnat to 10.10.0.30:80
        iif "vmbr0" tcp dport 443 dnat to 10.10.0.30:443
        iif "vmbr0" udp dport 443 dnat to 10.10.0.30:443
    }
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # NAT dla VM-ek wychodzących z vmbr1 na zewnątrz
        ip saddr 10.10.0.0/24 oif vmbr0 masquerade
    }
}

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        tcp dport 2277 accept

        # WireGuard - UDP 51820 (będzie DNAT-owane do VM)
        udp dport 51820 accept
        udp dport 51821 accept

        # Proxmox UI (8006) dostępny tylko z sieci wewnętrznej VM-ek
        iif vmbr1 tcp dport 8006 accept

        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Pozwól ruchowi wracać do istniejących połączeń
        ct state established,related accept

        # VM-ki z vmbr1 wychodzą do internetu przez vmbr0
        iif vmbr1 oif vmbr0 accept

        # WireGuard przychodzący z internetu do barvea-infra w vmbr1
        iif vmbr0 oif vmbr1 udp dport 51820 accept
        iif vmbr0 oif vmbr1 udp dport 51821 accept

        # VM-VM
        iif "vmbr1" oif "vmbr1" accept

        iif "vmbr0" oif "vmbr1" ip daddr 10.10.0.30 tcp dport { 80, 443 } accept
        iif "vmbr0" oif "vmbr1" ip daddr 10.10.0.30 udp dport 443 accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
