#!/usr/sbin/nft -f
# ═══════════════════════════════════════════════════════════════════
# BARVEA — barvea-host /etc/nftables.conf (IaC copy 1:1 z żywego,
# zrzut 2026-07-13, origin-only-CF 2026-11-19). Instalacja: cp → /etc/nftables.conf;
# systemctl enable --now nftables. ⚠️ KEEP-IN-SYNC z żywym plikiem.
# Uwaga: na hoście działa też legacy iptables z (a) f2b-sshd
# (fail2ban, dynamiczne — nie odtwarzać ręcznie) oraz (b) zdublowanym
# MASQUERADE 10.10.0.0/24 (artefakt sprzed migracji na nft; nft jest
# autorytatywny, duplikat nieszkodliwy — przy świeżej instalacji NIE
# odtwarzać).
# ═══════════════════════════════════════════════════════════════════

flush ruleset

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;

        # Forward WireGuard UDP 51820 z publicznego IP hosta na VM barvea-infra
        iif vmbr0 udp dport 51820 dnat to 10.10.0.10:51820
        iif vmbr0 udp dport 51821 dnat to 10.10.0.10:51821
        iif "vmbr0" tcp dport 80 dnat to 10.10.0.30:80
        iif "vmbr0" tcp dport 443 dnat to 10.10.0.30:443
        iif "vmbr0" udp dport 443 dnat to 10.10.0.30:443
    }
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # NAT dla VM-ek wychodzących z vmbr1 na zewnątrz
        ip saddr 10.10.0.0/24 oif vmbr0 masquerade
    }
}

table inet filter {
    # Zakresy Cloudflare (cloudflare.com/ips-v4) — TA SAMA lista co trusted_proxies
    # w Caddyfile. Origin 80/443 przyjmuje ruch WYLACZNIE z CF: bez tego kazdy
    # limit/WAF/challenge w CF dalo sie ominac, laczac sie wprost z
    # 178.63.205.222 z Host: app.barvea.com (audyt mobile 2026-10-28, wdrozone
    # 2026-11-19). Let's Encrypt HTTP-01 tez idzie przez proxy CF, wiec dziala.
    # Przy zmianie listy przez CF: odswiezyc TU i w Caddyfile.
    set cloudflare_v4 {
        type ipv4_addr
        flags interval
        elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22,
                     141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20,
                     197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
                     104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        tcp dport 2277 accept

        # WireGuard - UDP 51820 (będzie DNAT-owane do VM)
        udp dport 51820 accept
        udp dport 51821 accept

        # Proxmox UI (8006) dostępny tylko z sieci wewnętrznej VM-ek
        iif vmbr1 tcp dport 8006 accept

        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Pozwól ruchowi wracać do istniejących połączeń
        ct state established,related accept

        # VM-ki z vmbr1 wychodzą do internetu przez vmbr0
        iif vmbr1 oif vmbr0 accept

        # WireGuard przychodzący z internetu do barvea-infra w vmbr1
        iif vmbr0 oif vmbr1 udp dport 51820 accept
        iif vmbr0 oif vmbr1 udp dport 51821 accept

        # VM-VM
        iif "vmbr1" oif "vmbr1" accept

        # HTTP/HTTPS/HTTP3 do appki TYLKO z Cloudflare (set wyzej); reszta -> drop (policy)
        iif "vmbr0" oif "vmbr1" ip saddr @cloudflare_v4 ip daddr 10.10.0.30 tcp dport { 80, 443 } accept
        iif "vmbr0" oif "vmbr1" ip saddr @cloudflare_v4 ip daddr 10.10.0.30 udp dport 443 accept
        iif "vmbr0" oif "vmbr1" ip daddr 10.10.0.30 tcp dport { 80, 443 } counter drop
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
