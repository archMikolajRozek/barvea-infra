# BARVEA — resolver dla tunelu wg-users (VM 100, /etc/dnsmasq.d/wg-users.conf)
#
# PO CO (2026-11-10): klient Drive na macOS rozwiązuje *.barvea.internal
# WYŁĄCZNIE przez DNS z konfiguracji tunelu (10.67.0.1 z devices/enroll) —
# pliku hosts nie da się tam ruszyć bez uprawnień admina. Bez resolvera Mac
# zestawia tunel, nie znajduje app.barvea.internal i się rozłącza. Zamyka
# też punkt I2 Windows (koniec z wpisem w hosts przez instalator).
#
# ZASADY: słucha TYLKO na wg-users (10.67.0.1:53 udp+tcp), zero rekursji
# (no-resolv, brak server=), odpowiada tylko na barvea.internal — każda inna
# nazwa = NXDOMAIN. Adresy = DRIVE_WG_ALLOWED_IPS appki (10.10.0.30, 10.10.0.40).
# Firewall: INPUT 53 z 10.67.0.0/16 w PostUp wg-users.conf (BARVEA_USER_IN
# dotyczy FORWARD; ruch do 10.67.0.1 to INPUT na VM 100).

interface=wg-users
except-interface=lo        # bez loopbacku: resolv.conf VM 100 = 1.1.1.1, nie mieszamy
bind-interfaces
listen-address=10.67.0.1
port=53

no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
cache-size=150
log-queries=no

# tylko nasza strefa — reszta NXDOMAIN (local= bez server= = autorytatywne "nie ma")
local=/barvea.internal/
address=/app.barvea.internal/10.10.0.30
address=/drive.barvea.internal/10.10.0.40
