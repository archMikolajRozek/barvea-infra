# BARVEA — production docker-compose for VM 102 (barvea-app, 10.10.0.30)
#
# This compose runs ONLY the application container + Caddy reverse proxy.
# Postgres, Redis, MinIO are NOT here — they live on VM 101 (barvea-data, 10.10.0.20)
# as native services, accessed over the private vmbr1 bridge (10.10.0.0/24).
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. Fill all secrets in .env.production (chmod 600)
#   3. ./scripts/bootstrap.sh   # one-time: clones app, builds image, runs migrations
#   4. docker compose --env-file .env.production up -d
#   5. docker compose logs -f caddy   # watch for "certificate obtained"

services:
  # ───────────────────────────────────────────────────────────
  # Next.js application
  # Connects to barvea-data (10.10.0.20) for Postgres + Redis + MinIO.
  # No host port binding — only reachable through Caddy.
  # ───────────────────────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: barvea-app:latest
    container_name: barvea-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      DWG_CONVERTER_URL: "http://dwg-converter:8080"
      OFFICE_CONVERTER_URL: "http://office-converter:8080"
      POINT_CLOUD_PREVIEW_URL: "http://point-cloud-preview:8080"
      # Upload kawałkowy: kawałki lądują tu do czasu finalizacji (aplikacja
      # skleja CAŁY plik lokalnie, bo datad ma tylko POST /files — bez offsetu
      # i wznowień). Katalog MUSI pomieścić największe pliki (chmury punktów).
      UPLOAD_TMP_DIR: "/upload-tmp"
    volumes:
      # 2026-08-31: bind-mount na dedykowanym dysku 1 TB (VM 102 /dev/sdb,
      # LABEL=upload-tmp, ext4 -m 0 -T largefile4, scsi1 volblocksize=64k).
      # Wcześniej named volume na dysku root 75 G — dzielił go z obrazami
      # dockera i build cache (rośnie ~37 GB NA KAŻDY deploy), więc jeden
      # upload kilkudziesięciu GB zapełniał root i kładł Next + Caddy.
      # Katalog na hoście MUSI być chown 1001:1001 — bind-mount, w odróżnieniu
      # od pustego named volume, NIE dziedziczy właściciela z obrazu (EACCES).
      - /srv/upload-tmp:/upload-tmp
    networks:
      - barvea_web
    depends_on:
      dwg-converter:
        condition: service_healthy
      # service_started, NIE _healthy: konwersja Office->PDF to funkcja
      # poboczna. Gdyby LibreOffice nie wstal (np. po reboocie hosta),
      # twardy warunek zablokowalby start CALEJ aplikacji. Aplikacja sama
      # zwraca czytelny komunikat, gdy converter nie odpowiada.
      office-converter:
        condition: service_started
      point-cloud-preview:
        condition: service_started
    healthcheck:
      # Force IPv4 — `localhost` resolves to ::1 (IPv6) in some Docker netconfigs,
      # and Next.js bound to 0.0.0.0 isn't always reachable on the IPv6 loopback.
      # 127.0.0.1 keeps the probe deterministic.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Container needs to reach 10.10.0.20 (barvea-data).
    # Default bridge network → SNAT via host → vmbr1 → barvea-data. Works out of the box.
    # If reachability fails, uncomment extra_hosts below.
    # extra_hosts:
    #   - "barvea-data:10.10.0.20"

  # ───────────────────────────────────────────────────────────
  # DWG → SVG/PDF converter microservice
  # LibreDWG-based Flask app. Receives DWG buffers from `app`,
  # returns SVG (primary) or PDF (paperspace fallback). Internal
  # only — never exposed on host port. dwg2dxf is built into the
  # image but no longer used as a preview format (DXF output from
  # LibreDWG misaligns browser parsers; see lib/dwg-converter.ts).
  # ───────────────────────────────────────────────────────────
  dwg-converter:
    build:
      context: ./app/docker/dwg-converter
      dockerfile: Dockerfile
    image: barvea-dwg-converter:latest
    container_name: barvea-dwg-converter
    restart: unless-stopped
    networks:
      - barvea_web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────
  # Office → PDF converter microservice
  # LibreOffice headless (writer/calc/impress) za Flask+gunicorn.
  # Przyjmuje doc/docx/xls/xlsx/ppt/pptx/odt/ods/odp/rtf, zwraca PDF
  # do podgladu w przegladarce. Wewnetrzny — bez portu na hoscie.
  # Uwaga: obraz ~1.5 GB (ubuntu + LibreOffice + fonty) — pierwszy build
  # dlugi, kolejne z cache. soffice nie jest thread-safe: gunicorn jedzie
  # na 2 PROCESACH, kazdy request ma wlasny profil (patrz server.py).
  # ───────────────────────────────────────────────────────────
  office-converter:
    build:
      context: ./app/docker/office-converter
      dockerfile: Dockerfile
    image: barvea-office-converter:latest
    container_name: barvea-office-converter
    restart: unless-stopped
    networks:
      - barvea_web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # LibreOffice startuje wolniej niz dwg-converter (wiekszy obraz,
      # zimny cache stron) — 60 s zanim healthcheck zacznie liczyc bledy.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────
  # Point-cloud preview sidecar (PDAL)
  # Decymuje LAS/LAZ/PLY/PCD/XYZ/PTS/E57 do małego binarnego PLY dla
  # viewera w przeglądarce (surowa chmura = multi-GB; browser ma twardy
  # limit ~2 GB na ArrayBuffer). Wewnętrzny — bez portu na hoście.
  # Obraz: micromamba + PDAL z conda-forge (apt NIE ma pakietu pdal) —
  # pierwszy build ciągnie setki MB z conda-forge, kolejne z cache.
  # ───────────────────────────────────────────────────────────
  point-cloud-preview:
    build:
      context: ./app/docker/point-cloud-preview
      dockerfile: Dockerfile
    image: barvea-point-cloud-preview:latest
    container_name: barvea-point-cloud-preview
    restart: unless-stopped
    environment:
      # Scratch NA DUŻYM DYSKU: serwis streamuje źródło (default do 20 GB,
      # POINTCLOUD_MAX_BYTES) do pliku tymczasowego przed decymacją. Bez
      # TMPDIR lądowałoby to w overlayu na dysku root 75 G — jeden podgląd
      # dużej chmury zapełnia root (ta sama lekcja co śluza, 2026-08-31).
      TMPDIR: "/scratch"
      # Opcjonalny shared-secret (pusty = otwarte na wewnętrznym bridge'u,
      # jak dwg/office). Ustaw w .env.production po OBU stronach — appka
      # dostaje przez env_file, sidecar przez interpolację poniżej.
      POINTCLOUD_PREVIEW_TOKEN: "${POINTCLOUD_PREVIEW_TOKEN:-}"
    volumes:
      # Podkatalog na dysku śluzy (1 TB). Utwórz PRZED startem:
      #   sudo mkdir -p /srv/upload-tmp/pcp-scratch
      #   sudo chown <uid-MAMBA_USER> /srv/upload-tmp/pcp-scratch
      # uid sprawdź po buildzie: docker compose run --rm point-cloud-preview id
      - /srv/upload-tmp/pcp-scratch:/scratch
    networks:
      - barvea_web
    healthcheck:
      # PELNA SCIEZKA, nie gole "curl": w obrazie micromamba curl z
      # conda-forge siedzi w /opt/conda/bin, ktorego NIE MA w PATH dla
      # HEALTHCHECK/exec (entrypoint aktywuje env conda tylko dla CMD).
      # Gole "curl" = trwale unhealthy (zweryfikowane 2026-09-04).
      test: ["CMD", "/opt/conda/bin/curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Stack conda/PDAL startuje wolno — jak office-converter.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────
  # Caddy reverse proxy + auto Let's Encrypt
  # Listens publicly on 80/443 (DNAT'd from 10.10.0.10 by barvea-infra).
  # Terminates TLS, proxies to app:3005.
  # ───────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: barvea-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/barvea:/etc/ssl/barvea:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - barvea_web
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  barvea_web:
    driver: bridge
    name: barvea_web

volumes:
  caddy_data:
    name: barvea_caddy_data
  caddy_config:
    name: barvea_caddy_config
