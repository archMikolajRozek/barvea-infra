# BARVEA — production docker-compose for VM 102 (barvea-app, 10.10.0.30)
#
# This compose runs ONLY the application container + Caddy reverse proxy.
# Postgres, Redis, MinIO are NOT here — they live on VM 101 (barvea-data, 10.10.0.20)
# as native services, accessed over the private vmbr1 bridge (10.10.0.0/24).
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. Fill all secrets in .env.production (chmod 600)
#   3. ./scripts/bootstrap.sh   # one-time: clones app, builds image, runs migrations
#   4. docker compose --env-file .env.production up -d
#   5. docker compose logs -f caddy   # watch for "certificate obtained"

services:
  # ───────────────────────────────────────────────────────────
  # Next.js application
  # Connects to barvea-data (10.10.0.20) for Postgres + Redis + MinIO.
  # No host port binding — only reachable through Caddy.
  # ───────────────────────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: barvea-app:latest
    container_name: barvea-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      DWG_CONVERTER_URL: "http://dwg-converter:8080"
      # Upload kawałkowy: kawałki lądują tu do czasu finalizacji. Wolumen MUSI
      # mieć miejsce na największe pliki (chmury punktów = setki GB) — w razie
      # potrzeby podmień named volume na bind-mount na dużym dysku.
      UPLOAD_TMP_DIR: "/upload-tmp"
    volumes:
      - upload_tmp:/upload-tmp
    networks:
      - barvea_web
    depends_on:
      dwg-converter:
        condition: service_healthy
    healthcheck:
      # Force IPv4 — `localhost` resolves to ::1 (IPv6) in some Docker netconfigs,
      # and Next.js bound to 0.0.0.0 isn't always reachable on the IPv6 loopback.
      # 127.0.0.1 keeps the probe deterministic.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Container needs to reach 10.10.0.20 (barvea-data).
    # Default bridge network → SNAT via host → vmbr1 → barvea-data. Works out of the box.
    # If reachability fails, uncomment extra_hosts below.
    # extra_hosts:
    #   - "barvea-data:10.10.0.20"

  # ───────────────────────────────────────────────────────────
  # DWG → SVG/PDF converter microservice
  # LibreDWG-based Flask app. Receives DWG buffers from `app`,
  # returns SVG (primary) or PDF (paperspace fallback). Internal
  # only — never exposed on host port. dwg2dxf is built into the
  # image but no longer used as a preview format (DXF output from
  # LibreDWG misaligns browser parsers; see lib/dwg-converter.ts).
  # ───────────────────────────────────────────────────────────
  dwg-converter:
    build:
      context: ./app/docker/dwg-converter
      dockerfile: Dockerfile
    image: barvea-dwg-converter:latest
    container_name: barvea-dwg-converter
    restart: unless-stopped
    networks:
      - barvea_web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────
  # Caddy reverse proxy + auto Let's Encrypt
  # Listens publicly on 80/443 (DNAT'd from 10.10.0.10 by barvea-infra).
  # Terminates TLS, proxies to app:3005.
  # ───────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: barvea-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/barvea:/etc/ssl/barvea:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - barvea_web
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  barvea_web:
    driver: bridge
    name: barvea_web

volumes:
  caddy_data:
    name: barvea_caddy_data
  caddy_config:
    name: barvea_caddy_config
  upload_tmp:
    name: barvea_upload_tmp
