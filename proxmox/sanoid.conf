# BARVEA — barvea-host /etc/sanoid/sanoid.conf (IaC copy 2026-07-13).
# Instalacja: apt install sanoid; cp → /etc/sanoid/sanoid.conf;
# systemctl enable --now sanoid.timer. KEEP-IN-SYNC.
# ⚠️ Format snapshotów (autosnap_…_hourly) jest sprzęgnięty z Samba
# shadow_copy2 (Previous Versions na B:) — nie zmieniać prefixu/formatu.

[hddpool]
    use_template = production
    recursive = yes
    process_children_only = yes

  [template_production]
    hourly = 24
    daily = 7
    weekly = 4
    monthly = 6
    yearly = 0
    autosnap = yes
    autoprune = yes
    frequent_period = 0
